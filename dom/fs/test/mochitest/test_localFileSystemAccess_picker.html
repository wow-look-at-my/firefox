<html>
<head>
  <title>Local File System Access picker test</title>

  <script src="/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>

  <script type="text/javascript">
    const MockFilePicker = SpecialPowers.MockFilePicker;

    function armActivation() {
      SpecialPowers.wrap(document).notifyUserGestureActivation();
    }

    async function rejectsWith(promise, name, message) {
      try {
        await promise;
        ok(false, `${message}: should have rejected`);
      } catch (e) {
        is(e.name, name, `${message}: rejected with ${name}`);
      }
    }

    add_task(async function init() {
      ok("showOpenFilePicker" in window, "showOpenFilePicker exists");
      ok("showSaveFilePicker" in window, "showSaveFilePicker exists");
      ok("showDirectoryPicker" in window, "showDirectoryPicker exists");

      MockFilePicker.init();

      SimpleTest.registerCleanupFunction(() => {
        MockFilePicker.cleanup();
      });
    });

    add_task(async function test_no_activation_rejects() {
      await rejectsWith(window.showOpenFilePicker(), "SecurityError",
                        "open picker without user activation");
      await rejectsWith(window.showSaveFilePicker(), "SecurityError",
                        "save picker without user activation");
      await rejectsWith(window.showDirectoryPicker(), "SecurityError",
                        "directory picker without user activation");
    });

    add_task(async function test_cancel_rejects_abort() {
      await MockFilePicker.useAnyFile();
      MockFilePicker.returnValue = MockFilePicker.returnCancel;

      armActivation();
      await rejectsWith(window.showOpenFilePicker(), "AbortError",
                        "canceled open picker");
    });

    add_task(async function test_open_file_picker() {
      const file = await MockFilePicker.useAnyFile();
      MockFilePicker.returnValue = MockFilePicker.returnOK;

      armActivation();
      const handles = await window.showOpenFilePicker();
      is(handles.length, 1, "one handle picked");

      const handle = handles[0];
      is(handle.kind, "file", "open picker returns a file handle");
      is(handle.name, file.leafName, "handle name matches picked file");

      await rejectsWith(handle.getFile(), "UnknownError",
                        "getFile is not implemented yet");

      await rejectsWith(window.showOpenFilePicker(), "SecurityError",
                        "user activation is consumed per call");
    });

    add_task(async function test_save_file_picker() {
      const file = await MockFilePicker.useAnyFile();
      MockFilePicker.returnValue = MockFilePicker.returnReplace;

      armActivation();
      const handle = await window.showSaveFilePicker(
        { suggestedName: "myfile.txt" });
      is(handle.kind, "file", "save picker returns a file handle");
      is(handle.name, file.leafName, "handle name matches picked file");
    });

    add_task(async function test_directory_picker() {
      const tmpDir = SpecialPowers.Services.dirsvc.get("TmpD",
        SpecialPowers.Ci.nsIFile);
      MockFilePicker.useDirectory(tmpDir.path);
      MockFilePicker.returnValue = MockFilePicker.returnOK;

      armActivation();
      const handle = await window.showDirectoryPicker();
      is(handle.kind, "directory", "directory picker returns a directory handle");
      is(handle.name, tmpDir.leafName, "handle name matches picked directory");

      await rejectsWith(handle.getFileHandle("sub.txt", { create: true }),
                        "UnknownError", "getFileHandle is not implemented yet");
      await rejectsWith(handle.getDirectoryHandle("sub"), "UnknownError",
                        "getDirectoryHandle is not implemented yet");

      let iterationError = null;
      try {
        for await (const entry of handle.values()) {
          void entry;
        }
      } catch (e) {
        iterationError = e;
      }
      is(iterationError && iterationError.name, "UnknownError",
         "iteration is not implemented yet");
    });

    add_task(async function test_local_handle_refuses_clone() {
      await MockFilePicker.useAnyFile();
      MockFilePicker.returnValue = MockFilePicker.returnOK;

      armActivation();
      const [handle] = await window.showOpenFilePicker();

      let cloneError = null;
      try {
        structuredClone(handle);
      } catch (e) {
        cloneError = e;
      }
      is(cloneError && cloneError.name, "DataCloneError",
         "local handles refuse structured cloning");
    });
  </script>
</head>

<body></body>

</html>
